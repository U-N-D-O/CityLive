name: Create App Builds
run-name: Create ${{ inputs.target }} app build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Choose which app artifact to create
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  build-android-debug-apk:
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate app launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuuk-City-Live-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  build-ios-unsigned-ipa:
    if: ${{ inputs.target == 'all' || inputs.target == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate app launcher icons
        run: dart run flutter_launcher_icons

      - name: Build iOS app without codesigning
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          IPA_DIR="build/ios/ipa"

          test -d "$APP_PATH"

          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/Runner.app"

          cd "$IPA_DIR"
          ditto -c -k --sequesterRsrc --keepParent Payload NuukCityLive.ipa

          unzip -Z1 NuukCityLive.ipa | grep '^Payload/Runner.app/Info.plist$' >/dev/null
          unzip -Z1 NuukCityLive.ipa | grep '^Payload/Runner.app/Frameworks/App.framework/App$' >/dev/null

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuuk-City-Live-ios-unsigned-ipa
          path: build/ios/ipa/NuukCityLive.ipa
          retention-days: 90