name: nuuk_city_live
description: A CarPlay-first GPS and city guide app for Nuuk, Greenland.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  latlong2: ^0.9.1
  maplibre_gl: ^0.26.2
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  flutter_map: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/styles/
    - assets/data/